dataset:
  name: "SpaceNet 7 Cadastral Building Footprint Dataset"
  raw_dir: "sample/L15-0506E-1204N_2027_3374_13"
  processed_dir: "data/processed_spacenet7"
  image_size: [256, 256]
  in_channels: 3
  num_classes: 1

split:
  strategy: "temporal"
  train_months: 16   # 2018-01 through 2019-04
  val_months: 4      # 2019-05 through 2019-08
  test_months: 4     # 2019-09 through 2019-12
  patch_size: 256
  stride: 256
  train_count: 256
  val_count: 64
  test_count: 64

model:
  architecture: "unet"
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1

training:
  epochs: 10
  batch_size: 8
  learning_rate: 0.0005
  device: "cpu"
  save_dir: "results/checkpoints"

polygonization:
  min_area_pixels: 15
  simplify_tolerance: 0.5
